[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project6-elevator-simulator"
version = "1.0.0"
description = "Persistent integration simulator for the Project 6 elevator supervisory application"
requires-python = ">=3.11"
dependencies = [
    "mysql-connector-python==9.0.0",
]

[tool.setuptools]
packages = ["sim"]

